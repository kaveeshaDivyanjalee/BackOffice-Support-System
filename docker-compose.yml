version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: backoffice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-YOUR_STRONG_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-slt_db}
    ports:
      - "5432:5432"  # n8n Cloud එකට connect වෙන්න Port එක expose කර ඇත
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: backoffice_backend
    ports:
      - "127.0.0.1:8085:8000"
    environment:
      - USE_TEST_MODE=false
      - AZURE_CLIENT_ID=1be92fb6-e237-4bd6-ae1e-f2c4644d1766
      - AZURE_TENANT_ID=534253fc-dfb6-462f-b5ca-cbe81939f5ee
      - DATABASE_URL=postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-YOUR_STRONG_PASSWORD}@db:5432/${DB_NAME:-slt_db}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: backoffice_frontend
    ports:
      - "127.0.0.1:8084:80"
    depends_on:
      - backend
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: backoffice_node_exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: always
volumes:
  postgres_data: